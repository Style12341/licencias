<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Administrativos</h2>

    <!-- Tabla de resultados -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-primary">
            <tr>
                <th>Username</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Provincia</th>
                <th>Ciudad</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${administrativos}">
                <td th:text="${usuario.username}">jadmin</td>
                <td th:text="${usuario.firstName}">Juan</td>
                <td th:text="${usuario.lastName}">Pérez</td>
                <td th:text="${usuario.provincia}">Buenos Aires</td>
                <td th:text="${usuario.ciudad}">La Plata</td>
                <td>
                    <a class="btn btn-sm btn-outline-primary">Modificar</a>
                    <form th:action="@{/admin/users/delete/{id}(id=${usuario.id})}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('¿Estás seguro de eliminar este usuario?')">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(administrativos)}">
                <td colspan="6" class="text-center">No se encontraron usuarios administrativos.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Botón para dar de alta un usuario -->
    <div class="d-flex justify-content-end">
        <a class="btn btn-success" th:href="@{/admin/users/new}">Dar de Alta Usuario</a>
    </div>
</div>
</body>
</html>
