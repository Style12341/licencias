<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Gestión de Usuarios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/home">Sistema de Licencias</a>
        <div class="navbar-nav ms-auto">
        <span class="navbar-text me-3">
          Bienvenido, <span sec:authentication="name"></span> (Administrador)
        </span>
            <a class="btn btn-outline-light" th:href="@{/logout}">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4" th:text="${title}">Administrativos</h2>

    <!-- Search Bar -->
    <form class="row g-3 mb-3" th:action="@{/admin/users}" method="get">
        <div class="col-md-8">
            <input type="text"
                   name="nombre"
                   class="form-control"
                   placeholder="Buscar por nombre"
                   th:value="${param.nombre}" />
        </div>
        <div class="col-md-4 text-end">
            <button type="submit" class="btn btn-primary w-100">Buscar</button>
        </div>
    </form>

    <!-- Tabla de resultados -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-light">
            <tr>
                <th>Username</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Provincia</th>
                <th>Ciudad</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${administrativos}">
                <td th:text="${usuario.username}">jadmin</td>
                <td th:text="${usuario.firstName}">Juan</td>
                <td th:text="${usuario.lastName}">Pérez</td>
                <td th:text="${usuario.provincia}">Buenos Aires</td>
                <td th:text="${usuario.ciudad}">La Plata</td>
                <td>
                    <!-- Modificar -->
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/admin/users/edit/{id}(id=${usuario.id})}">
                        Modificar
                    </a>

                    <!-- Eliminar (no a mí mismo) -->
                    <form th:if="${usuario.username != currentUsername}"
                          th:action="@{/admin/users/delete/{id}(id=${usuario.id})}"
                          method="post"
                          class="d-inline">
                        <sec:csrfInput/>
                        <button class="btn btn-sm btn-outline-danger"
                                type="submit"
                                onclick="return confirm('¿Eliminar usuario?')">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(administrativos)}">
                <td colspan="6" class="text-center">No hay usuarios.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Botón Alta Usuario -->
    <div class="d-flex justify-content-end mt-3">
        <a class="btn btn-primary" th:href="@{/admin/users/new}">
            Dar de Alta Usuario
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
