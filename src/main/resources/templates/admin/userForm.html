<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Alta de Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2 class="mb-4">Alta de Usuario</h2>

  <!-- Mensaje general de error -->
  <div th:if="${errorMessage}" class="alert alert-danger mb-3" role="alert">
    <i class="fas fa-exclamation-triangle"></i>
    <span th:text="${errorMessage}"></span>
  </div>

  <div th:if="${usernameRequiredError}" class="alert alert-danger">
    El nombre de usuario es obligatorio.
  </div>

  <div th:if="${usernameExistsError}" class="alert alert-danger">
    Ya existe un usuario con ese nombre de usuario.
  </div>

  <div th:if="${firstNameError}" class="alert alert-danger mb-3" role="alert">
    <i class="fas fa-exclamation-triangle"></i>
    Por favor, ingrese el nombre.
  </div>

  <div th:if="${lastNameError}" class="alert alert-danger mb-3" role="alert">
    <i class="fas fa-exclamation-triangle"></i>
    Por favor, ingrese el apellido.
  </div>

  <div th:if="${passwordError}" class="alert alert-danger mb-3" role="alert">
    <i class="fas fa-exclamation-triangle"></i>
    La contraseña debe tener al menos 6 caracteres.
  </div>

  <div th:if="${roleError}" class="alert alert-danger mb-3" role="alert">
    <i class="fas fa-exclamation-triangle"></i>
    Por favor, seleccione un rol.
  </div>

  <form th:action="@{/admin/users/save}" th:object="${usuario}" method="post" class="row g-3">

    <div class="col-md-6">
      <label for="username" class="form-label">Username</label>
      <input type="text" th:field="*{username}" class="form-control" id="username" required />
    </div>

    <div class="col-md-6">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" th:field="*{password}" class="form-control" id="password" required />
    </div>

    <div class="col-md-6">
      <label for="firstName" class="form-label">Nombre</label>
      <input type="text" th:field="*{firstName}" class="form-control" id="firstName" required />
    </div>

    <div class="col-md-6">
      <label for="lastName" class="form-label">Apellido</label>
      <input type="text" th:field="*{lastName}" class="form-control" id="lastName" required />
    </div>

    <div class="col-md-6">
      <label for="provincia" class="form-label">Provincia</label>
      <input type="text" th:field="*{provincia}" class="form-control" id="provincia" />
    </div>

    <div class="col-md-6">
      <label for="ciudad" class="form-label">Ciudad</label>
      <input type="text" th:field="*{ciudad}" class="form-control" id="ciudad" />
    </div>

    <div class="mb-3">
      <label for="role" class="form-label">Rol</label>
      <select class="form-select" id="role" name="role" th:field="*{role}">
        <option th:each="r : ${roles}"
                th:value="${r}"
                th:text="${r}">Rol</option>
      </select>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a th:href="@{/admin/users}" class="btn btn-secondary">Cancelar</a>
    </div>

  </form>
</div>
</body>
</html>
