<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Modificar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Sistema de Licencias</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3"> Bienvenido, <span sec:authentication="name"></span> (Administrativo) </span>
            <a class="btn btn-outline-light" th:href="@{/logout}">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<!-- Contenido principal -->
<div class="container mt-4">
    <h2 class="mb-4">Modificar Usuario Administrativo</h2>

    <form th:action="@{/admin/users/update}" th:object="${usuario}" method="post">
        <!-- Campo oculto para el ID del usuario -->
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="username" class="form-label">Nombre de Usuario</label>
            <input type="text" th:field="*{username}" class="form-control" id="username" readonly />
        </div>

        <div class="mb-3">
            <label for="firstName" class="form-label">Nombre</label>
            <input type="text" th:field="*{firstName}" class="form-control" id="firstName" required />
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Apellido</label>
            <input type="text" th:field="*{lastName}" class="form-control" id="lastName" required />
        </div>

        <div class="mb-3">
            <label for="provincia" class="form-label">Provincia</label>
            <input type="text" th:field="*{provincia}" class="form-control" id="provincia" required />
        </div>

        <div class="mb-3">
            <label for="ciudad" class="form-label">Ciudad</label>
            <input type="text" th:field="*{ciudad}" class="form-control" id="ciudad" required />
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-secondary" th:href="@{/admin/users}">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
    </form>
</div>

<!-- Bootstrap JS (opcional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
