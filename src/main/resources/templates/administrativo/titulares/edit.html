<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Editar Titular</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" href="/administrativo/home">Sistema de Licencias</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3"> Bienvenido, <span sec:authentication="name"></span> (Administrativo) </span>
            <a class="btn btn-outline-light" th:href="@{/logout}">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div th:if="${errorMessage}" class="alert alert-danger shadow-sm no-print" role="alert">
        <h4 class="alert-heading">Error al Cargar el Comprobante</h4>
        <p th:text="${errorMessage}"></p>
        <hr>
        <a th:href="@{/administrativo/home}" class="btn btn-danger">Volver</a>
    </div>

    <div th:if="${holder}">
        <h2 class="mb-4">Editar Titular</h2>
        <form th:action="@{/administrativo/titulares/editar/{dni}(dni=${holder.dni})}" method="post" th:object="${holder}" class="row g-3">

            <div class="col-md-6">
                <label class="form-label">DNI</label>
                <input type="text" class="form-control" th:field="*{dni}" readonly required />
            </div>

            <div class="col-md-6">
                <label class="form-label">CUIL</label>
                <input type="text" class="form-control" th:field="*{cuil}" readonly required />
            </div>

            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{name}" required />
            </div>

            <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" th:field="*{lastName}" required />
            </div>

            <div class="col-md-6">
                <label class="form-label">Domicilio</label>
                <input type="text" class="form-control" th:field="*{address}" required />
            </div>

            <div class="col-md-6">
                <label class="form-label">Ciudad</label>
                <input type="text" class="form-control" th:field="*{city}" required />
            </div>

            <div class="col-md-6">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" th:field="*{birthDate}" required />
            </div>
            <div class="col-md-6">
                <label class="form-label">Grupo sanguíneo y factor RH</label>
                <select class="form-select" th:field="*{bloodType}" required>
                    <option th:each="type : ${T(met.agiles.licencias.enums.BloodType).values()}"
                            th:value="${type}" th:text="${type}">Tipo</option>
                </select>
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{donor}" id="donorCheck" />
                    <label class="form-check-label" for="donorCheck">¿Donante de órganos?</label>
                </div>
            </div>

            <div class="col-12" th:if="${error}">
                <div class="alert alert-danger" th:text="${error}"></div>
            </div>

            <div class="col-12" th:if="${#fields.hasErrors('*')}">
                <div class="alert alert-danger">
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                    </ul>
                </div>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">Actualizar Titular</button>
                <a th:href="@{/administrativo/titulares}" class="btn btn-secondary ms-2">Cancelar</a>
            </div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        var birthDateValue = /*[[${holder != null ? #temporals.format(holder.birthDate, 'yyyy-MM-dd') : ''}]]*/ '';
        var birthDateInput = document.getElementById("birthDate");

        if (birthDateValue && birthDateInput) {
            birthDateInput.value = birthDateValue;
        }
    });
</script>
</body>
</html>
